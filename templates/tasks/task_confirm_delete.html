{% extends "base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Delete Task</h1>
<p>Are you sure you want to delete "<strong>{{ object.name }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{{ object.project.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
