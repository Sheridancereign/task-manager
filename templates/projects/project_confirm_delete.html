{% extends "base.html" %}

{% block title %}Delete Project{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Delete Project</h1>
<p>Are you sure you want to delete "<strong>{{ object.name }}</strong>"? All its tasks will be deleted too.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'projects:list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
