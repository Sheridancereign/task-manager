{% extends "base.html" %}
{% load allauth %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <h1 class="h3 mb-4">Sign In</h1>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_login" class="form-label">Username or Email</label>
                <input type="text" name="login" class="form-control" id="id_login" required autofocus>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger">Please enter a correct username and password.</div>
            {% endif %}
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <p class="mt-3">
            Don't have an account? <a href="{% url 'account_signup' %}">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
