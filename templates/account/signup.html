{% extends "base.html" %}
{% load allauth %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <h1 class="h3 mb-4">Sign Up</h1>

        <form method="post" action="{% url 'account_signup' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <input type="email" name="email" class="form-control" id="id_email">
            </div>
            <div class="mb-3">
                <label for="id_password1" class="form-label">Password</label>
                <input type="password" name="password1" class="form-control" id="id_password1" required>
            </div>
            <div class="mb-3">
                <label for="id_password2" class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control" id="id_password2" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger">
                    {% for field, errors in form.errors.items %}
                        {{ errors.0 }}
                    {% endfor %}
                </div>
            {% endif %}
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>

        <p class="mt-3">
            Already have an account? <a href="{% url 'account_login' %}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
